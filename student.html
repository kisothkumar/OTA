<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join a Quiz — Online Assessment</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="dot"></span> Online&nbsp;Assessment</a>
    </header>

    <main style="max-width:460px; margin:0 auto; padding:40px 0 80px;">

      <!-- ================= JOIN PANEL ================= -->
      <section id="joinPanel">
        <div class="center mt-24">
          <div class="pulse-orb">
            <span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span>
            <div class="core"></div>
          </div>
        </div>
        <h1 class="reveal" style="text-align:center; font-size:1.9rem; margin-top:8px;">Join the room</h1>
        <p class="reveal" style="text-align:center; animation-delay:.06s;">Enter the code from the front of the class.</p>

        <div class="card reveal mt-24" style="padding:28px; animation-delay:.12s;">
          <div class="field">
            <label for="codeInput">Room code</label>
            <input id="codeInput" class="otp" type="text" maxlength="5" placeholder="XXXXX" autocomplete="off" />
          </div>
          <div class="field">
            <label for="nameInput">Your name</label>
            <input id="nameInput" type="text" placeholder="How should we display you?" autocomplete="off" />
          </div>
          <button class="btn btn-primary" id="joinBtn" type="button" style="width:100%;">Join quiz →</button>
          <p id="joinError" class="text-coral small mt-16 hidden"></p>
        </div>
      </section>

      <!-- ================= LOBBY PANEL ================= -->
      <section id="lobbyPanel" class="hidden" style="text-align:center;">
        <span class="live-chip"><span class="ld"></span> Connected</span>
        <h2 class="mt-24" style="font-size:1.6rem;">You're in, <span id="lobbyName" class="text-amber"></span>.</h2>
        <p class="mt-8">Hang tight — the teacher is about to start the quiz.</p>
        <div class="center mt-32">
          <div class="pulse-orb">
            <span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span>
            <div class="core"></div>
          </div>
        </div>
        <p class="small muted mt-32">Room <span id="lobbyCode" style="font-family:var(--font-mono); letter-spacing:.1em; color:var(--chalk-100);"></span></p>
      </section>

    </main>
  </div>

  <!-- Firebase SDK (only used once you paste real keys into js/firebase-config.js) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
